[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "leonos"
version = "0.1.0"
description = "Frozen Kronos-base versus LightGBM on a fixed U.S.-equity panel"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "exchange-calendars>=4.7,<5",
  "huggingface-hub==0.33.1",
  "lightgbm==4.6.0",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "pyyaml>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
kronos = [
  "einops==0.8.1",
  "safetensors==0.6.2",
  # Matches the CUDA 12.8 build already validated on the Blackwell host.
  "torch==2.9.0",
  "tqdm==4.67.1",
]
qlib = [
  "pyqlib @ git+https://github.com/microsoft/qlib.git@79633dd9506ea689e5400dea0197717b5b3d74b7",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
leonos = "leonos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leonos"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
